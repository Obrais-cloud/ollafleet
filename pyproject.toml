[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollafleet"
version = "0.1.0"
description = "CLI fleet manager for multiple Ollama instances"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Brais Revalderia", email = "orevalderia@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.scripts]
ollafleet = "ollafleet.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
